name: Node.js CI
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "releases/**"
  pull_request:
    types: [opened]
    branches:
      - "main"
    paths-ignore:
      - README.md
jobs:
  unit-test:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22.x, 24.x]
    runs-on: ${{ matrix.os }}
    steps:
      - name: clone repo
        uses: actions/checkout@v6
      - name: Install Node JS
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Node Dependancy
        run: npm install
      - name: Run Unit Test
        run: npm test
  code-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: clone repo
        uses: actions/checkout@v6
      - name: Install Node JS
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
      - name: Install Node Dependancy
        run: npm install
      - name: run code coverage
        continue-on-error: true
        run: npm run coverage
      - name: Upload Report
        uses: actions/upload-artifact@v7
        with:
          path: coverage
  Doker_build:
    needs: [code-coverage, unit-test]
    runs-on: ubuntu-latest
    environment: env 
    steps:
      - name: clone repo
        uses: actions/checkout@v6

      - name: build docker and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ vars.DOKER_HUB_USERNAME }}/digilians-nodejs:${{ github.sha }}
      - name: test docker container
        run: |
          docker container run --name test-container -d -p 3200:3000 ${{ vars.DOKER_HUB_USERNAME }}/digilians-nodejs:${{ github.sha }}
          sleep 10
          crul http://localhost:3200
          echo $?
          docker container stop test-container

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}


      - name: build docker and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tag: ${{ vars.DOKER_HUB_USERNAME }}/digilians-nodejs:${{ github.sha }}