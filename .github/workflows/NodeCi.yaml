name: nodejs-ci
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
env:
    PORT: 4000

jobs:
    unit-tests:
        strategy:
            matrix:
                node-version: [22.x]
                os: [ubuntu-latest, windows-latest, macos-latest]
                exclude:
                    - node-version: 14.x
                      os: macos-latest
            fail-fast: false
            max-parallel: 2
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v2
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v3
              with:
                node-version: '${{ matrix.node-version }}'
            - name: Cache npm dependencies
              uses: actions/cache@v4
              with:
                path: node_modules
                key: ${{ runner.os }}-node-${{ matrix.node-version }}-npm-${{ hashFiles('package-lock.json') }}
            - name: Install dependencies
              run: npm install
            - name: Run tests
              run: npm test
            
            - name: Set env variable for port linux 
              if: runner.os == 'Linux' || runner.os == 'macOS'
              run: export PORT=${{ env.PORT }}
            - name: Set env variable for port windows
              if: runner.os == 'windows'
              run: Set-Variable -Name port -Value ${{ env.PORT }}
    Coverage:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
            - name: Use Node.js 22.x
              uses: actions/setup-node@v3
              with:
                node-version: '22.x'
            - name: Cache npm dependencies
              uses: actions/cache@v4
              with:
                path: node_modules
                key: ${{ runner.os }}-node-22.x-npm-${{ hashFiles('package-lock.json') }}
            - name: Install dependencies
              run: npm install
            - name: Run tests with coverage
              run: npm run coverage
              continue-on-error: true
            - name: Upload coverage Artifact
              uses: actions/upload-artifact@v7
              with:
                name: coverage-report
                path: coverage/
              

    Docker_Build:
        runs-on: ubuntu-latest
        needs: [unit-tests, Coverage]
        steps:
            - uses: actions/checkout@v2
            - name: Build Docker Image
              uses: docker/build-push-action@v2
              with:
                context: .
                push: false
                load: true
                tags: ${{ vars.DOCKER_HUB_USERNAME }}/my-node-app:latest
            - name: Docker Test
              run: |
                docker run --rm -d -p ${{ env.PORT }}:${{ env.PORT }} -e PORT=${{ env.PORT }} --name my-node-app ${{ vars.DOCKER_HUB_USERNAME }}/my-node-app:latest 
                sleep 10
                curl -f http://localhost:${{ env.PORT }} || exit 1
                docker stop my-node-app
            - name: Trivy image scan (GitHub annotations)
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                scan-type: image
                image-ref: ${{ vars.DOCKER_HUB_USERNAME }}/my-node-app:latest
                format: github
                exit-code: '1'
                ignore-unfixed: true
                severity: HIGH,CRITICAL
            - name: Log in to Docker Hub
              uses: docker/login-action@v2
              with:
                username: ${{ vars.DOCKER_HUB_USERNAME }}
                password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
            - name: Push Docker Image
              uses: docker/build-push-action@v2
              with:
                context: .
                push: true
                tags: ${{ vars.DOCKER_HUB_USERNAME }}/my-node-app:latest