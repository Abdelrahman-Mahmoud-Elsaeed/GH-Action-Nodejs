name: NodeCI
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'releases/**'
  pull_request:
    types: [opened]
    branches:
      - 'main'
    paths-ignore:
      - README.md

jobs:
  unit-test:
    strategy:
      matrix:
        os: [ubuntu-latest,macos-latest,windows-latest]
        node-version: [14.x,22.x,24.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Node JS
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Node Dependancy
        run: npm install
      - name: Run Unit Test
        run: npm test
